<svg xmlns="http://www.w3.org/2000/svg"
width="1200" height="1050" viewBox="0 0 1200 1050">

<defs>

  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6"
      flood-color="#000000" flood-opacity="0.12"/>
  </filter>

  <marker id="arrow" markerWidth="12" markerHeight="12"
    refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
  </marker>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 36px;
      font-weight: 700;
      fill: #0F172A;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 18px;
      fill: #64748B;
    }

    .heading {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      fill: #0F172A;
    }

    .body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      fill: #475569;
    }

    .decision {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 19px;
      font-weight: 700;
      fill: #0F172A;
    }
  </style>

</defs>

<!-- Background -->
<rect width="1200" height="1050" fill="#F8FAFC"/>

<!-- Header -->
<text x="600" y="58" text-anchor="middle" class="title">
  Credit Card Fraud Decision Engine
</text>

<text x="600" y="88" text-anchor="middle" class="subtitle">
  Prediction → Decisioning → Investigation → Monitoring
</text>


<!-- TRANSACTION -->

<rect x="300" y="120" width="600" height="95"
  rx="18" fill="#FFFFFF" stroke="#CBD5E1"
  stroke-width="2" filter="url(#shadow)"/>

<text x="600" y="158" text-anchor="middle" class="heading">
  Transaction
</text>

<text x="600" y="187" text-anchor="middle" class="body">
  Amount · Time · Anonymized transaction features
</text>


<!-- ARROW -->

<line x1="600" y1="215" x2="600" y2="250"
  stroke="#475569" stroke-width="3"
  marker-end="url(#arrow)"/>


<!-- MODEL -->

<rect x="250" y="255" width="700" height="120"
  rx="18" fill="#E0F2FE" stroke="#0284C7"
  stroke-width="2" filter="url(#shadow)"/>

<text x="600" y="295" text-anchor="middle" class="heading">
  Fraud Detection Model
</text>

<text x="600" y="325" text-anchor="middle" class="body">
  Class-Weighted XGBoost
</text>

<text x="600" y="351" text-anchor="middle" class="body">
  Temporal validation · PR-AUC · Extreme class imbalance
</text>


<!-- ARROW -->

<line x1="600" y1="375" x2="600" y2="410"
  stroke="#475569" stroke-width="3"
  marker-end="url(#arrow)"/>


<!-- PROBABILITY -->

<rect x="300" y="415" width="600" height="90"
  rx="18" fill="#FFFFFF" stroke="#CBD5E1"
  stroke-width="2" filter="url(#shadow)"/>

<text x="600" y="452" text-anchor="middle" class="heading">
  Fraud Probability
</text>

<text x="600" y="480" text-anchor="middle" class="body">
  Continuous risk score P(Fraud)
</text>


<!-- ARROW -->

<line x1="600" y1="505" x2="600" y2="540"
  stroke="#475569" stroke-width="3"
  marker-end="url(#arrow)"/>


<!-- DECISION ENGINE -->

<rect x="225" y="545" width="750" height="120"
  rx="18" fill="#FEF3C7" stroke="#D97706"
  stroke-width="2" filter="url(#shadow)"/>

<text x="600" y="582" text-anchor="middle" class="heading">
  Decision Engine
</text>

<text x="600" y="612" text-anchor="middle" class="body">
  Frozen threshold = 0.56 · Investigation capacity = 50
</text>

<text x="600" y="640" text-anchor="middle" class="decision">
  P(Fraud) ≥ 0.56 → REVIEW
</text>


<!-- SPLIT -->

<line x1="600" y1="665" x2="600" y2="700"
  stroke="#475569" stroke-width="3"/>

<line x1="600" y1="700" x2="350" y2="735"
  stroke="#475569" stroke-width="3"
  marker-end="url(#arrow)"/>

<line x1="600" y1="700" x2="850" y2="735"
  stroke="#475569" stroke-width="3"
  marker-end="url(#arrow)"/>


<!-- APPROVE -->

<rect x="125" y="740" width="450" height="90"
  rx="18" fill="#FFFFFF" stroke="#94A3B8"
  stroke-width="2" filter="url(#shadow)"/>

<text x="350" y="777" text-anchor="middle" class="heading">
  APPROVE
</text>

<text x="350" y="805" text-anchor="middle" class="body">
  Lower-risk transaction
</text>


<!-- REVIEW -->

<rect x="625" y="740" width="450" height="90"
  rx="18" fill="#F3E8FF" stroke="#9333EA"
  stroke-width="2" filter="url(#shadow)"/>

<text x="850" y="777" text-anchor="middle" class="heading">
  REVIEW
</text>

<text x="850" y="805" text-anchor="middle" class="body">
  High-risk transaction
</text>


<!-- REVIEW PIPELINE -->

<line x1="850" y1="830" x2="850" y2="860"
  stroke="#475569" stroke-width="3"
  marker-end="url(#arrow)"/>


<rect x="625" y="865" width="450" height="80"
  rx="18" fill="#FFFFFF" stroke="#CBD5E1"
  stroke-width="2" filter="url(#shadow)"/>

<text x="850" y="898" text-anchor="middle" class="heading">
  Investigator Queue
</text>

<text x="850" y="925" text-anchor="middle" class="body">
  Risk band · Priority · Review ranking
</text>


<!-- SHAP + PSI -->

<line x1="850" y1="945" x2="850" y2="975"
  stroke="#475569" stroke-width="3"
  marker-end="url(#arrow)"/>

<rect x="375" y="980" width="450" height="55"
  rx="15" fill="#DCFCE7" stroke="#16A34A"
  stroke-width="2"/>

<text x="600" y="1015" text-anchor="middle" class="heading">
  SHAP Explainability · PSI Monitoring
</text>

</svg>
